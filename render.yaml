services:
  - type: web
    name: clip-studio
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_USERNAME
        value: admin
      - key: APP_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /tmp/clip-studio
      - key: MAX_UPLOAD_GB
        value: "0.5"
      - key: ENABLE_LIVE_MONITOR
        value: "false"
